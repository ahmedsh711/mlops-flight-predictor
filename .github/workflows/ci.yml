name: Flight Predictor CI

"on":
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

permissions:
  contents: read
  packages: write

jobs:

  ## Job 1: Lint & Type Check 
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh && echo "$$HOME/.local/bin" >> $$GITHUB_PATH

      - name: Install dev dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Run ruff (linter)
        run: ruff check src/ api/ tests/

      - name: Run ruff (formatter check)
        run: ruff format --check src/ api/ tests/


  ## Job 2: Unit Tests ─────────────────────────────────────────────────────
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint      # Only run if lint passes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh && echo "$$HOME/.local/bin" >> $$GITHUB_PATH

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Run tests with coverage
        run: |
          pytest tests/ -v \
            --cov=flight_predictor \
            --cov-report=term-missing \
            --cov-fail-under=40

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()


  ## Job 3: Quality Gate (on main branch only) 
  quality-gate:
    name: Model Quality Gate
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh && echo "$$HOME/.local/bin" >> $$GITHUB_PATH

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Download training data via DVC
        run: |
          uv pip install --system "dvc[s3]"
          dvc pull data/raw/flight_data.csv
        env:
          # DVC remote credentials (set as GitHub Secrets)
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Train model
        run: flight-train

      - name: Run quality gate
        run: python scripts/quality_gate.py

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: model-artifacts-${{ github.sha }}
          path: |
            models/pipeline.joblib
            models/model_info.json


  ## Job 4: Docker Build 
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: quality-gate
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Download model artifacts
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts-${{ github.sha }}
          path: models/

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/flight-predictor:latest
            ghcr.io/${{ github.repository }}/flight-predictor:${{ github.sha }}