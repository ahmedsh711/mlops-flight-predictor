[project]
name = "mlops-flight-predictor"
version = "0.1.0"
description = "Indian domestic flight price prediction (XGBoost + TTR)"
readme = "README.md"
requires-python = ">=3.11"

authors = [
    { name = "Ahmed Al-Shobaki", email = "ahmedelshobakey711@gmail.com" }
]

dependencies = [
    "fastapi>=0.141.1",
    "joblib>=1.6.0",
    "mlflow>=2.12.0",
    "numpy>=1.26.0,<2.3.0",
    "onnxmltools>=1.16.0",
    "onnxruntime>=1.18.0",
    "pandas>=2.2,<3",
    "pydantic>=2.7.0",
    "python-multipart>=0.0.9",
    "scikit-learn>=1.4.0",
    "streamlit>=1.35.0",
    "structlog>=24.1.0",
    "uvicorn>=0.29.0",
    "xgboost>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

experiments = [
    "dvc>=3.50.0",
    "dvc-s3>=3.1.0",
    "pygtrie<2.6.0",
]

[project.scripts]
flight-train = "flight_predictor.train:main"
flight-predict = "flight_predictor.predict:main"
flight-export = "flight_predictor.export:main"
mlops-flight-train = "flight_predictor.train:main"
mlops-flight-predict = "flight_predictor.predict:main"
mlops-flight-export = "flight_predictor.export:main"

[tool.uv.build-backend]
module-name = "flight_predictor"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=flight_predictor --cov-report=term-missing"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"